# nginx site for https://smart-mining.sena.my
#   - Vue SPA (built files from frontend/dist) served at /
#   - Laravel (api/public) handles /api, /admin (Filament), /storage (selfies), /livewire-*, /filament, /css|js|fonts/filament
# Adjust: server_name, ssl_* paths, root paths, php-fpm socket.

server {
    listen 80;
    server_name smart-mining.sena.my;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name smart-mining.sena.my;

    ssl_certificate     /etc/letsencrypt/live/smart-mining.sena.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smart-mining.sena.my/privkey.pem;

    client_max_body_size 20m;            # selfies are sent as base64 JSON (~100–500 KB)

    set $laravel /var/www/selgem/api/public;
    root /var/www/selgem/frontend/dist;  # SPA build output
    index index.html;

    # ── Laravel: API, admin panel, Livewire, uploaded files ──
    location ~ ^/(api|admin|filament|sanctum)(/|$) { root $laravel; try_files $uri /index.php?$query_string; }
    location ~ ^/livewire-[a-z0-9]+/                { root $laravel; try_files $uri /index.php?$query_string; }
    location ^~ /storage/                           { root $laravel; try_files $uri =404; expires 7d; }
    location ~ ^/(css|js|fonts)/filament/           { root $laravel; try_files $uri =404; expires 30d; }

    location = /index.php {
        root $laravel;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $laravel/index.php;
        fastcgi_param DOCUMENT_ROOT $laravel;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # adjust to your PHP-FPM socket
        fastcgi_read_timeout 600;                     # Sync Data / KB refresh can take a few minutes
    }

    # ── Vue SPA: static assets + history-mode fallback ──
    location /assets/ { expires 30d; access_log off; try_files $uri =404; }
    location /data/   { try_files $uri =404; }        # offline mock JSON (fallback only)
    location / { try_files $uri $uri/ /index.html; }

    # Camera + GPS are allowed on this origin (needed for selfie clock-in)
    add_header Permissions-Policy "camera=(self), geolocation=(self)" always;
    add_header X-Content-Type-Options nosniff always;
}
